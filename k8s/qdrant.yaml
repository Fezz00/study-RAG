# Qdrant: the vector database, with its data on a persistent volume.

# A PersistentVolumeClaim asks the cluster for disk space that survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
spec:
  accessModes: [ReadWriteOnce] # one node can write to it at a time
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  # The volume can only be used by one pod, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.2
          ports:
            - containerPort: 6333
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe: # "ready to receive requests?"
            httpGet:
              path: /readyz
              port: 6333
            periodSeconds: 5
          livenessProbe: # "still alive, or restart it?"
            httpGet:
              path: /healthz
              port: 6333
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
# A Service gives the pods one stable name and address: http://qdrant:6333
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333

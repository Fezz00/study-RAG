# One entry point for the whole app. The ingress-nginx controller (minikube addon) routes by host name:
#   http://study-rag.local      -> ui
#   http://api.study-rag.local  -> api, but only the paths listed below
# Not exposed on purpose: Qdrant (database) and the API's /metrics - Prometheus reads those inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: study-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # allow lecture PDF uploads (default is 1 MB)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # Streamlit keeps a websocket open
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: study-rag.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
    - host: api.study-rag.local
      http:
        paths:
          # Only what clients need. Any other path (e.g. /metrics) gets 404 from the ingress.
          - path: /ask
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /documents
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /docs # interactive API docs (see the security hardening issue)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /openapi.json # the docs page loads the API description from here
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000

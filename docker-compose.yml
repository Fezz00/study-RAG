# Starts the whole app: docker compose up --build
# Ollama is NOT in here: it runs natively on the Mac (Docker on macOS has no GPU access).

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Inside Docker, "localhost" is the container itself, so services use names instead.
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
      DATA_DIR: /app/data
      # Optional overrides from a .env file, with defaults after ":-"
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      TOP_K: ${TOP_K:-5}
      MIN_SCORE: ${MIN_SCORE:-0.5}
    volumes:
      - ./data:/app/data # uploaded PDFs land in ./data on the Mac
    depends_on:
      - qdrant

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

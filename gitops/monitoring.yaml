# A second Argo CD Application: Prometheus + Grafana from the kube-prometheus-stack Helm chart.
# Argo CD installs and updates it - no manual "helm install". Registered by scripts/gitops-up.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts # a Helm chart repository, not Git
    chart: kube-prometheus-stack
    targetRevision: 92.11.0 # pinned chart version: change it in a PR to upgrade
    helm:
      releaseName: monitoring
      valuesObject:
        # Not needed locally - saves memory in the small cluster.
        alertmanager:
          enabled: false
        # minikube doesn't expose these control-plane parts, so their checks would only show as "down".
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            # Also pick up ServiceMonitors from other apps (our k8s/servicemonitor.yaml), not only this chart's.
            serviceMonitorSelectorNilUsesHelmValues: false
            retention: 7d # keep a week of numbers
            resources:
              requests:
                cpu: 100m
                memory: 400Mi
              limits:
                memory: 1Gi

        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.study-rag.local
          sidecar:
            dashboards:
              # Load dashboards from ConfigMaps labelled grafana_dashboard=1 in any namespace (ours is in k8s/).
              searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the chart's resource definitions are too big for normal "kubectl apply"
